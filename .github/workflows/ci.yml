name: python CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-text:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: use python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: install dependencies
        run: |
            python -m pip install --upgrade pip
            echo "first"
            pip install -r requirements.txt
            echo "install success"
            
      - name: run test
        run: |
          echo "Running tests"
          python main.py